name: 前端基础 CI 流水线

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. 把 GitHub 仓库的代码拉取到这台云端服务器上
    - name: 检查并拉取代码
      uses: actions/checkout@v4

    # 2. 安装 Node.js 环境
    - name: 配置 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm' # 开启缓存，下次跑流水线会快很多

    # 3. 安装项目依赖
    - name: 安装依赖
      run: npm install

    # 4. 执行构建或测试 (视你的项目而定)
    - name: 模拟构建
      run: |
        echo "如果项目有 package.json，这里就写 npm run build"
        echo "如果只是纯静态页面，这步就当是打个日志"