name: Monorepo 前后台 CI 流水线

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 任务一：构建后台 admin
  build-admin:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: 配置 Node.js 环境 (admin)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'admin/package-lock.json' # 指向 admin 的锁文件
    - name: 安装依赖 (admin)
      working-directory: ./admin
      run: npm ci
    - name: 执行构建 (admin)
      working-directory: ./admin
      run: npm run build

  # 任务二：构建前台 h5
  build-h5:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: 配置 Node.js 环境 (h5)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'h5/package-lock.json' # 指向 h5 的锁文件
    - name: 安装依赖 (h5)
      working-directory: ./h5
      run: npm ci
    - name: 执行构建 (h5)
      working-directory: ./h5
      run: npm run build