name: Monorepo 前后台 CI/CD 流水线

on:
  push:
    branches: [ "main" ]

# 部署到 GitHub Pages 需要的权限配置
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 任务一：构建后台 admin
  build-admin:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'admin/package-lock.json'
    - working-directory: ./admin
      run: npm ci
    - working-directory: ./admin
      run: npm run build

  # 任务二：构建前台 h5，并上传产物
  build-h5:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'h5/package-lock.json'
    - working-directory: ./h5
      run: npm ci
    - working-directory: ./h5
      run: npm run build
      
    # 新增：将 h5 的 dist 目录作为制品上传，供后续部署使用
    - name: 上传 H5 的构建产物
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./h5/dist

  # 任务三：正式部署（CD 环节）
  deploy-h5:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-h5 # 关键点：必须等 h5 构建成功才会执行
    steps:
    - name: 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4