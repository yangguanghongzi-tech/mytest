server:
  port: 8080

spring:
  application:
    name: learning-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:learning}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

app:
  auth:
    # jwt：生产；dev：本地联调（token 形如 dev:t1:u1:admin）
    mode: ${AUTH_MODE:jwt}
    admin-role: ${AUTH_ADMIN_ROLE:admin}
    jwt:
      algorithm: ${JWT_ALG:RS256}
      jwks-url: ${JWT_JWKS_URL:}
      public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
      hmac-secret: ${JWT_HMAC_SECRET:}
      issuer: ${JWT_ISSUER:}
      claims:
        tenant-id: ${JWT_CLAIM_TENANT:tenantId}
        user-id: ${JWT_CLAIM_USER:sub}
        roles: ${JWT_CLAIM_ROLES:roles}
  obs:
    enabled: ${OBS_ENABLED:true}
    endpoint: ${OBS_ENDPOINT:}
    access-key: ${OBS_AK:}
    secret-key: ${OBS_SK:}
    bucket: ${OBS_BUCKET:}
  upload:
    part-size: 10MB
    max-video-size: 2GB
    max-doc-size: 100MB
    max-cover-size: 5MB
  content:
    url-expires-seconds: 7200
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
